[package]
name = "qingshi-jianghu"
version = "0.1.0"
description = "青石江湖 Windows 单机 Demo"
authors = ["Qingshi Jianghu"]
edition = "2021"

[lib]
name = "qingshi_jianghu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
