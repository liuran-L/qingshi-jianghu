<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2500" viewBox="0 0 1800 2500">
  <defs>
    <style>
      .bg { fill: #f7f0df; }
      .title { font: 700 43px 'Microsoft YaHei', sans-serif; fill: #2f2924; text-anchor: middle; }
      .subtitle { font: 22px 'Microsoft YaHei', sans-serif; fill: #665b50; text-anchor: middle; }
      .band { font: 700 28px 'Microsoft YaHei', sans-serif; fill: #fffaf0; }
      .head { font: 700 25px 'Microsoft YaHei', sans-serif; fill: #2f2924; text-anchor: middle; }
      .txt { font: 20px 'Microsoft YaHei', sans-serif; fill: #41382f; text-anchor: middle; }
      .small { font: 18px 'Microsoft YaHei', sans-serif; fill: #574d42; text-anchor: middle; }
      .note { font: 18px 'Microsoft YaHei', sans-serif; fill: #574d42; }
      .line { stroke: #7b6a58; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #877866; stroke-width: 3; fill: none; stroke-dasharray: 10 8; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7b6a58"/></marker>
  </defs>

  <rect class="bg" width="1800" height="2500"/>
  <text x="900" y="78" class="title">《青石江湖》第一至第三日当前可玩流程总览</text>
  <text x="900" y="118" class="subtitle">第九阶段已实现内容 · 有限选项 / 本地规则 / 三种可结束路线</text>

  <rect x="55" y="150" width="1690" height="56" rx="10" fill="#9d3e2e"/>
  <text x="85" y="188" class="band">第 1 日：带伤入城</text>

  <rect x="120" y="245" width="1560" height="110" rx="14" fill="#f5ddd2" stroke="#b85847" stroke-width="3"/>
  <text x="900" y="286" class="head">荒道遇袭后抵达城门</text>
  <text x="900" y="322" class="txt">路引遗失 · 轻伤疲劳 · 可检查行囊、伤口与免检货车</text>

  <path d="M900 355 V405" class="line"/>
  <rect x="80" y="415" width="510" height="220" rx="14" fill="#e9efe2" stroke="#4d7961" stroke-width="3"/>
  <text x="335" y="458" class="head">马三刀：城门盘查</text>
  <text x="335" y="497" class="txt">如实 / 含糊 / 失忆 / 假名 / 沉默</text>
  <text x="335" y="532" class="txt">观察货车后可追问；可退开等待</text>
  <text x="335" y="568" class="txt">搜查、拘押后可由宁不平现场复核</text>
  <text x="335" y="604" class="small">口供、疑点、扣物与更正均存读</text>

  <rect x="645" y="415" width="510" height="220" rx="14" fill="#f5e9c9" stroke="#b48738" stroke-width="3"/>
  <text x="900" y="458" class="head">悦来客栈：苏晚棠</text>
  <text x="900" y="497" class="txt">真名 / 固定化名 / 拒绝登记</text>
  <text x="900" y="532" class="txt">同行调查、展示残片、住宿记录</text>
  <text x="900" y="568" class="txt">低价落脚或一次性以工抵宿</text>
  <text x="900" y="604" class="small">登记差异在实际知情后才会被比对</text>

  <rect x="1210" y="415" width="510" height="220" rx="14" fill="#e0edf2" stroke="#49758a" stroke-width="3"/>
  <text x="1465" y="458" class="head">回春堂：沈砚秋</text>
  <text x="1465" y="497" class="txt">问诊、验伤授权、布条归属、保密</text>
  <text x="1465" y="532" class="txt">完整处理 / 只止血 / 拒检</text>
  <text x="1465" y="568" class="txt">欠诊金、药房杂活抵扣与补账</text>
  <text x="1465" y="604" class="small">病案副本须按授权出具</text>

  <path d="M335 635 V710 H900" class="line"/>
  <path d="M900 635 V710" class="line"/>
  <path d="M1465 635 V710 H900" class="line"/>
  <rect x="540" y="725" width="720" height="100" rx="14" fill="#eee4f2" stroke="#735771" stroke-width="3"/>
  <text x="900" y="766" class="head">陆观澜：观察、识假与指点</text>
  <text x="900" y="802" class="txt">同行与货车转述 · 有依据识假 · 获得步法指点种子</text>

  <rect x="55" y="870" width="1690" height="56" rx="10" fill="#426e87"/>
  <text x="85" y="908" class="band">第 2 日：尸体、回声与选择</text>

  <rect x="120" y="970" width="1560" height="110" rx="14" fill="#dcecf3" stroke="#49758a" stroke-width="3"/>
  <text x="900" y="1011" class="head">河边无名尸送入回春堂</text>
  <text x="900" y="1047" class="txt">程守义身份：荒道同行回忆 或 客栈商旅名册；伤痕可与主角比对</text>

  <path d="M900 1080 V1130" class="line"/>
  <rect x="80" y="1140" width="510" height="205" rx="14" fill="#f5e9c9" stroke="#b48738" stroke-width="3"/>
  <text x="335" y="1183" class="head">第一日的可见回声</text>
  <text x="335" y="1222" class="txt">城门复核、假名、展示残片、</text>
  <text x="335" y="1256" class="txt">验伤/保密、陆观澜识假分别影响</text>
  <text x="335" y="1291" class="txt">台词、风险解释与河岸资格</text>
  <text x="335" y="1325" class="small">NPC 不自动共享未知信息</text>

  <rect x="645" y="1140" width="510" height="205" rx="14" fill="#e0edf2" stroke="#49758a" stroke-width="3"/>
  <text x="900" y="1183" class="head">证据链与县衙</text>
  <text x="900" y="1222" class="txt">残片、病案、货车观察、身份确认</text>
  <text x="900" y="1256" class="txt">两种不同来源可向宁不平报案</text>
  <text x="900" y="1291" class="txt">保密后需单独授权病案副本</text>
  <text x="900" y="1325" class="small">报案只出示，正式交存才移交证物</text>

  <rect x="1210" y="1140" width="510" height="205" rx="14" fill="#eee4f2" stroke="#735771" stroke-width="3"/>
  <text x="1465" y="1183" class="head">有限成长</text>
  <text x="1465" y="1222" class="txt">陆观澜解锁步法树，正式训练获点</text>
  <text x="1465" y="1256" class="txt">沈砚秋互动解锁医术树，学习获点</text>
  <text x="1465" y="1291" class="txt">步法影响旅行；医术改善非关键观察</text>
  <text x="1465" y="1325" class="small">技能点与节点前置均可存读校验</text>

  <rect x="55" y="1400" width="1690" height="56" rx="10" fill="#916c2f"/>
  <text x="85" y="1438" class="band">第 3 日：固定船期与三种终局</text>
  <rect x="470" y="1495" width="860" height="100" rx="14" fill="#f5ddd2" stroke="#b85847" stroke-width="3"/>
  <text x="900" y="1535" class="head">丁字十七号货船：09:00 抵埠，15:00 货车离城</text>
  <text x="900" y="1571" class="txt">世界照常推进；治疗、训练、杂活、候船都会消耗游戏时间</text>

  <path d="M900 1595 V1640" class="line"/>
  <path d="M900 1640 H320 V1680" class="line"/>
  <path d="M900 1640 V1680" class="line"/>
  <path d="M900 1640 H1480 V1680" class="line"/>

  <rect x="70" y="1690" width="500" height="385" rx="16" fill="#e0edf2" stroke="#49758a" stroke-width="4"/>
  <text x="320" y="1740" class="head">结局 A：封存盐引</text>
  <text x="320" y="1782" class="txt">条件：身份、医学比对、病案、残片</text>
  <text x="320" y="1816" class="txt">与不同来源证据齐备，向宁不平报案</text>
  <text x="320" y="1852" class="txt">查车 → 核簿 → 15:00 前正式交存</text>
  <text x="320" y="1890" class="txt">马三刀候审；货车与材料封存</text>
  <text x="320" y="1925" class="txt">获得三日暂留凭条与交存收据</text>
  <text x="320" y="1970" class="small">残片转入县衙，终态冻结</text>

  <rect x="650" y="1690" width="500" height="385" rx="16" fill="#e9efe2" stroke="#4d7961" stroke-width="4"/>
  <text x="900" y="1740" class="head">结局 B：夜渡生还</text>
  <text x="900" y="1782" class="txt">条件：确认危险关联；尚未报案</text>
  <text x="900" y="1816" class="txt">拒绝报案，在河岸等待货车离城</text>
  <text x="900" y="1852" class="txt">夜渡离开青石，不假称案件解决</text>
  <text x="900" y="1890" class="txt">残片仍由玩家持有或按既有事实处置</text>
  <text x="900" y="1925" class="txt">程守义未进入正式案卷</text>
  <text x="900" y="1970" class="small">世界事件照常结算，终态冻结</text>

  <rect x="1230" y="1690" width="500" height="385" rx="16" fill="#f5ddd2" stroke="#b85847" stroke-width="4"/>
  <text x="1480" y="1740" class="head">结局 C：残片易手</text>
  <text x="1480" y="1782" class="txt">条件：持有残片，且掌柜见过残片</text>
  <text x="1480" y="1816" class="txt">或马三刀实际递话，收到中人口信</text>
  <text x="1480" y="1852" class="txt">河岸等待货车离城后交给未具名中人</text>
  <text x="1480" y="1890" class="txt">得到暂时通行承诺，不获得银钱</text>
  <text x="1480" y="1925" class="txt">残片从背包移除，不能再报案或封存</text>
  <text x="1480" y="1970" class="small">中人不获知未被传达的信息</text>

  <rect x="120" y="2140" width="1560" height="190" rx="16" fill="#fffaf0" stroke="#9b8c75" stroke-width="3"/>
  <text x="160" y="2190" class="note">共同规则</text>
  <text x="160" y="2230" class="note">• 时间、伤势、疲劳、银钱、关系、口供、证物、人情账本与技能点均由本地规则结算并存读。</text>
  <text x="160" y="2270" class="note">• 死亡、拘押与任一结局冻结时，禁止旅行、对话、调查、经济与成长动作；保存、读取和历史回看仍可用。</text>
  <text x="160" y="2310" class="note">• 当前未实现：乔五正式登场、码头自由探索、战斗、第四日、自由输入、真实 AI、完整武学与师承系统。</text>

  <text x="900" y="2410" class="subtitle">图例：本图仅反映第九阶段的当前可玩范围；早期“一、二日扩展对话流程分支图”保留为历史设计快照。</text>
</svg>
