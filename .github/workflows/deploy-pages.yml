name: 部署 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建静态试玩版
        run: |
          npm run desktop:build
          cp dist-desktop/index.desktop.html dist-desktop/index.html

      - name: 上传页面文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-desktop

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
